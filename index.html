<!DOCTYPE html>
<html>
<head>
    <title>Sort the Entered Array</title>
</head>
<body>
    <h1>Sort the Entered Array</h1>
    <label>Enter array values (separated by commas):</label>
    <br>
    <input type="text" id="arrayValues" value="90, 33, 56, 100, 43">
    <br><br>

    <button onclick="sortArray()">Sort</button>

    <h2>Original Array:</h2>
    <p id="original"></p>

    <h2>Sorted Array:</h2>
    <p id="sorted"></p>

    <script>
        function sortArray() {
            let input = document.getElementById("arrayValues").value;

            let numbers = [];
            let value = "";
            let index = 0;

            for (let i = 0; i < input.length; i++) {
                if (input[i] == ",") {
                    numbers[index] = Number(value.trim());
                    index++;
                    value = "";
                } else {
                    value += input[i];

                }
            }
            numbers[index] = Number(value.trim());

            let unsortedArray = "";
            for (let i = 0; i < numbers.length; i++) {
                unsortedArray +=
                    "Index " + i + ": " + numbers[i] + "<br>";

            }
            document.getElementById("original").innerHTML = unsortedArray;


            // Bubble Sort
            for (let i = 0; i < numbers.length - 1; i++) {
                for (let j = 0; j < numbers.length - 1 - i; j++) {
                    if (numbers[j] > numbers[j + 1]) {
                        let temp = numbers[j];
                        numbers[j] = numbers[j + 1];
                        numbers[j + 1] = temp;
                    }
                }
            }
            let sortedArray = "";

            for (let i = 0; i < numbers.length; i++) {
                sortedArray +=
                    "Index " + i + ": " + numbers[i] + "<br>";

            }
            document.getElementById("sorted").innerHTML = sortedArray;
        }

    </script>
</body>
</html>
